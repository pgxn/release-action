name: PGXN Release Action
description: Release Postgres extensions and tools on PGXN.
author: David E. Wheeler
branding:
  icon: upload
  color: purple

inputs:
  username:
    description: PGXN username
    required: true
  password:
    description: PGXN
    required: true
  submodules:
    description: Recursively checkout submodules
    default: false
  archive-options:
    description: Options to the `git archive` (or `git archive-all`) command
  dry-run:
    description: Print the release command, rather than execute it
    default: false
  rearchive:
    description: Create the `.zip` archive file even it it already exists
    default: false
outputs:
  archive:
    description: The zip archive file name created and released
    value: ${{ steps.bundle.outputs.archive }}

runs:
  using: composite
  steps:
    - name: Validate Meta
      shell: bash
      run: |
        set -eu
        if [ -e META.json ]; then
            sudo apt-get --quiet install -y libsemver-perl
            curl -sL https://cpanmin.us/ -o "$RUNNER_TEMP/cpanm" && chmod +x "$RUNNER_TEMP/cpanm"
            sudo $"$RUNNER_TEMP/cpanm" --quiet --notest PGXN::Meta::Validator
            validate_pgxn_meta META.json
        else
            echo 'ERROR:  No META.json file'
            echo 'DETAIL: See https://manager.pgxn.org/howto for how to create a PGXN'
            echo '        distribution, including the required META.json file.'
            exit 2
        fi

    - name: Bundle
      id: bundle
      shell: bash
      run: |
        set -eu
        # Get the distribution name and version.
        distname="$(jq -r .name    META.json)"
        version="$(jq -r .version META.json)"
        release="${distname}-${version}"

        if [ ! -e "$release.zip" ] || [ "${{ inputs.rearchive }}" == 'true' ]; then
          if [ "${{ inputs.submodules }}" == 'true' ]; then
              sudo pip install --root-user-action=ignore git-archive-all
              git archive-all -v --prefix "${release}/" --force-submodules ${{ inputs.archive-options }} "${release}.zip"
          else
              git archive -v --format zip --prefix "${release}/" ${{ inputs.archive-options }} --output "${release}.zip" HEAD
          fi
        else
          printf '%s exists, skipping\n', "$release.zip"
        fi

        printf 'archive=%s.zip\n' "$release" >> "$GITHUB_OUTPUT"

    - name: Release
      shell: bash
      run: |
        set -eu
        if [ "${{ inputs.dry-run }}" == 'true' ]; then
            echo curl -s --user "${{ inputs.username }}:${{ inputs.password }}" -F 'submit=Release It!' -F "archive=@${{ steps.bundle.outputs.archive }}" -H 'X-Requested-With: XMLHttpRequest' --silent --output /dev/stderr --write-out "%{http_code}" https://manager.pgxn.org/upload
            exit
        fi

        status="$(curl -s --user "${{ inputs.username }}:${{ inputs.password }}" -F 'submit=Release It!' -F "archive=@${{ steps.bundle.outputs.archive }}" -H 'X-Requested-With: XMLHttpRequest' --silent --output /dev/stderr --write-out "%{http_code}" https://manager.pgxn.org/upload)"
        if [ "${status}" -ne 200 ]; then
            echo 'ERROR: Release failed'
            exit 2
        fi
